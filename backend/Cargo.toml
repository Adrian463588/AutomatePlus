[package]
name = "automate-plus-native"
version = "1.3.0"
description = "Offline native host for AutomatePlus"
authors = ["AutomatePlus Core Team"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "automate_plus_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AutomatePlus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tauri = { version = "=2.11.5", features = [] }
rfd = "=0.15.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
