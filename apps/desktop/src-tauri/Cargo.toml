[package]
name = "automate-plus-native"
version = "1.0.0"
description = "Offline native host for AutomatePlus"
authors = ["AutomatePlus Core Team"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "automate_plus_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "AutomatePlus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
